version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dicechess
      POSTGRES_USER: dicechess
      POSTGRES_PASSWORD: dicechess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    image: python:3.11-slim
    working_dir: /workspace/apps/server_fastapi
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
